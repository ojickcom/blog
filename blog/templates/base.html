<!DOCTYPE html>
<html lang="ko">
<head>
    {% load static %}
    {% block extra_head %}
        <link rel="stylesheet" href="{% static 'blog/style.css' %}">
    {% endblock %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}블로그{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* === 공통 기본 스타일 === */
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .blog-image {
            height: 200px;
            object-fit: cover;
        }
        .title-preview {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
        }
        .navbar-nav .nav-link {
            margin: 0 0.2rem;
        }

        /* === 공통 카드 스타일 === */
        .compact-card {
            width: 100%;
            min-width: 0;
            max-width: none;
            font-size: 0.85rem;
            min-height: 72px;
        }
        .compact-card .card-body {
            padding: 0.6rem 0.75rem;
            gap: 0.35rem;
        }
        .card-body.d-flex.flex-column {
            gap: 0 !important;
        }
        .title-container {
            min-height: auto;
            margin-bottom: 0.2rem;
        }
        .compact-title {
            font-size: 0.95rem;
            line-height: 1.3;
            margin-bottom: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .compact-title span {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
}
        .compact-meta {
            font-size: 0.78rem;
            line-height: 1.25;
            margin: 0;
            padding: 0;
        }
        .meta-section {
            margin-top: auto;
            padding-top: 0.15rem;
            padding-bottom: 0;
        }
        .compact-btn,
        .copy-btn {
            font-size: 0.72rem;
            padding: 0.2rem 0.45rem;
            min-height: 28px;
            line-height: 1.2;
            width: auto;
            text-align: center;
        }
        .copy-btn {
            min-width: 72px;
        }
        .compact-header {
            font-size: 1.15rem;
            margin-bottom: 0.6rem;
        }
        .card-title-two-lines {
            height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-box-orient: vertical;
        }
        .copy-success-text {
            word-break: break-all;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'blog_list_pending' %}">📝 블로그</a>
            <a class="navbar-brand" href="http://ojickcom.duckdns.org:8000/completed/">완료 글</a>
            <a class="navbar-brand" href="http://ojickcom.duckdns.org:8000/shopping_keywords/click_list/">클릭 키워드</a>
            <a class="navbar-brand" href="{% url 'copy_stats' %}">복사 통계</a>
            <a class="navbar-brand" href="{% url 'shopping_keyword_list' %}">📝 쇼핑 전체</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'client_list' %}">거래처</a>
                    <a class="nav-link" href="/admin/">⚙️ 관리자</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-1">
        {% block content %}{% endblock %}
    </div>
    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0">&copy; 2025 블로그. All rights reserved.</p>
    </footer>

    <div class="modal fade" id="globalCopySuccessModal" tabindex="-1" aria-labelledby="globalCopySuccessModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="globalCopySuccessModalLabel">복사 완료</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="mb-2">✅ 항목이 성공적으로 복사되었습니다.</p>
                    <strong id="globalCopiedText" class="copy-success-text"></strong>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">확인</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTFyMGUHv+azPRcahT" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const copyModalElement = document.getElementById('globalCopySuccessModal');
            const copiedTextElement = document.getElementById('globalCopiedText');
            const copyModal = copyModalElement ? new bootstrap.Modal(copyModalElement) : null;

            window.showCopySuccessModal = function(text, autoHideMs) {
                if (!copyModal || !copiedTextElement) {
                    return;
                }

                copiedTextElement.textContent = text ? `"${text}"` : '';
                copyModal.show();

                if (autoHideMs) {
                    setTimeout(() => {
                        copyModal.hide();
                    }, autoHideMs);
                }
            };

            window.copyTextWithFeedback = function(text, options) {
                const settings = Object.assign({
                    errorMessage: '복사에 실패했습니다.',
                    autoHideMs: 2000,
                    onSuccess: null,
                    successTextTarget: null,
                    successText: null,
                    resetSuccessTextAfterMs: 1500,
                    feedbackElement: null,
                    feedbackDisplayMs: 2000,
                }, options || {});

                const originalSuccessText = settings.successTextTarget ? settings.successTextTarget.innerHTML : null;
                const handleSuccess = function() {
                    window.showCopySuccessModal(text, settings.autoHideMs);

                    if (settings.successTextTarget && settings.successText) {
                        settings.successTextTarget.innerHTML = settings.successText;
                        setTimeout(() => {
                            settings.successTextTarget.innerHTML = originalSuccessText;
                        }, settings.resetSuccessTextAfterMs);
                    }

                    if (settings.feedbackElement) {
                        settings.feedbackElement.style.display = 'inline';
                        setTimeout(() => {
                            settings.feedbackElement.style.display = 'none';
                        }, settings.feedbackDisplayMs);
                    }

                    if (typeof settings.onSuccess === 'function') {
                        settings.onSuccess();
                    }
                };

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text).then(handleSuccess).catch(function(error) {
                        alert(settings.errorMessage);
                        throw error;
                    });
                }

                return new Promise(function(resolve, reject) {
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();

                    try {
                        document.execCommand('copy');
                        handleSuccess();
                        resolve();
                    } catch (error) {
                        alert(settings.errorMessage);
                        reject(error);
                    } finally {
                        document.body.removeChild(textArea);
                    }
                });
            };
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
